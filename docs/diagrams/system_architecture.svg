raph workflow</text><text x="525" y="302" text-anchor="middle" font-family="Arial" font-size="12" fill="#52677b">Plan, retrieve, analyze; bounded correction</text><rect x="730" y="240" width="290" height="90" rx="10" fill="#e6f5f1" stroke="#8aa9b6"/><text x="875" y="274" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#183049">Durable checkpoints</text><text x="875" y="302" text-anchor="middle" font-family="Arial" font-size="12" fill="#52677b">SQLite thread state and interrupts</text><rect x="30" y="400" width="290" height="90" rx="10" fill="#e6f5f1" stroke="#8aa9b6"/><text x="175" y="434" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#183049">Verified local providers</text><text x="175" y="462" text-anchor="middle" font-family="Arial" font-size="12" fill="#52677b">Ollama Qwen + embeddings; Chroma</text><rect x="380" y="400" width="290" height="90" rx="10" fill="#e6f5f1" stroke="#8aa9b6"/><text x="525" y="434" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#183049">Human approval gate</text><text x="525" y="462" text-anchor="middle" font-family="Arial" font-size="12" fill="#52677b">Review evidence and uncertainty</text><rect x="730" y="400" width="290" height="90" rx="10" fill="#e6f5f1" stroke="#8aa9b6"/><text x="875" y="434" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#183049">Human handoff / retry</text><text x="875" y="462" text-anchor="middle" font-family="Arial" font-size="12" fill="#52677b">Insufficient evidence or saved failure</text><rect x="30" y="560" width="290" height="90" rx="10" fill="#e6f5f1" stroke="#8aa9b6"/><text x="175" y="594" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#183049">Optional cloud adapters</text><text x="175" y="622" text-anchor="middle" font-family="Arial" font-size="12" fill="#52677b">Configured and gated; not live-verified</text><rect x="380" y="560" width="